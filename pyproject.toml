[project]
name = "motionbrick-mlx"
version = "0.0.1"
description = "Real-time character motion generation on Apple Silicon, in MLX"
requires-python = ">=3.11"
dependencies = ["mlx>=0.20", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
export = ["pygltflib>=1.16"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
